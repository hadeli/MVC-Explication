<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block titre %}MVC{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="/">Accueil</a>
        {% if utilisateurConnecte == null %}
            | <a href="/login">Connexion</a>
            | <a href="/register">Inscription</a>
        {% else %}
            | <a href="/logout">Déconnexion</a>
        {% endif %}
    </nav>

{% yield contenu %}
</body>
</html>
