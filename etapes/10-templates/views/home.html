{% extends "layout" %}

{% block titre %}Accueil{% endblock %}

{% block contenu %}
<h1>Bienvenue</h1>

{% if utilisateurConnecte != null %}
    <p>Bonjour <strong>{{ utilisateurConnecte.email }}</strong>, vous êtes connecté.</p>
{% else %}
    <p>Vous n'êtes pas connecté. <a href="/login">Connectez-vous</a> ou <a href="/register">créez un compte</a>.</p>
{% endif %}
{% endblock %}
